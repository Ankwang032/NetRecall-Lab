# Alembic CLI 설정. 앱은 시작할 때 자동으로 upgrade하므로 이 파일은 리비전을 만들 때만 쓴다.
#   alembic revision --autogenerate -m "설명"
# DB 위치는 NETRECALL_DATABASE_URL 환경변수를 따른다 (backend/migrations/env.py).

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
