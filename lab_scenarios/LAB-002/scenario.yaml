id: LAB-002
title: 라우터 두 대 너머로 통신하기
type: build
concepts: [NET-010]
time_limit_minutes: 60

parameters:              # 실행마다 새로 고른다. 서로 겹치지 않는다
  lan1:    {pool: 10.0.0.0/8, prefix: 24}
  lan2:    {pool: 10.0.0.0/8, prefix: 24}
  transit: {pool: 172.16.0.0/12, prefix: 30}

nodes:
  pc1: {kind: host}
  r1:  {kind: router}
  r2:  {kind: router}
  pc2: {kind: host}

links:
  - [pc1:eth1, r1:eth1]
  - [r1:eth2, r2:eth2]
  - [r2:eth1, pc2:eth1]

preset:                  # 배포할 때 넣는 설정. 경로는 학습자 몫이다
  addresses:
    pc1:eth1: lan1.host(10)
    r1:eth1:  lan1.host(1)
    r1:eth2:  transit.host(1)
    r2:eth2:  transit.host(2)
    r2:eth1:  lan2.host(1)
    pc2:eth1: lan2.host(10)

goal: |
  PC1({lan1})과 PC2({lan2})가 서로 ping되게 하라. 라우터 R1과 R2는 {transit}으로 연결되어 있다.
  인터페이스 주소는 이미 들어 있다. 동적 라우팅 프로토콜은 쓰지 않는다.

# hints: 검사마다 개념 질문 → 확인할 곳 → 할 일 순서. 설정 명령은 쓰지 않고, 값은 이미 보여 준 대역·주소만 쓴다
checks:
  - id: pc1-to-pc2
    description: PC1 → PC2 ping
    ping: {from: pc1, to: pc2:eth1}
    hints:
      - PC1에서 PC2까지 가려면 PC1, R1, R2가 각자 다음에 어디로 보낼지 알아야 합니다. 응답이 돌아오는 길도 따로 필요합니다.
      - 어디서 막히는지 나눠 보세요. PC1에서 `ping -c 3`으로 R1({r1:eth1}), R2({r2:eth2}), PC2({pc2:eth1}) 순서로 쳐 보세요.
      - 요청은 R1이 {lan2} 대역 쪽으로, 응답은 R2가 {lan1} 대역 쪽으로 보내야 합니다. 라우터 경로·PC 경로 검사 중 실패한 것부터 고치세요.
  - id: pc2-to-pc1
    description: PC2 → PC1 ping
    ping: {from: pc2, to: pc1:eth1}
    hints:
      - 이번에는 PC2가 보내는 쪽입니다. PC2, R2, R1이 각자 PC1 쪽으로 보낼 곳을 알아야 합니다.
      - PC2에서 `ping -c 3`으로 R2({r2:eth1}), R1({r1:eth2}), PC1({pc1:eth1}) 순서로 쳐서 어디까지 가는지 보세요.
      - 경로가 모두 맞는데 한쪽 방향만 안 된다면, PC1이나 PC2의 lo 같은 다른 인터페이스에 상대 PC 주소가 남아 있지 않은지 `ip addr`로 보세요.
  - id: r1-route
    description: R1이 LAN2로 갈 때 직접 넣은 경로를 쓴다
    route: {node: r1, to: pc2:eth1}
    hints:
      - 라우터는 직접 연결된 대역({lan1}, {transit})만 압니다. {lan2} 대역은 R1에 직접 연결되어 있지 않습니다.
      - R1에서 `show ip route`로 라우팅 테이블을 보세요. {lan2} 대역으로 가는 줄이 있나요? 줄 맨 앞 글자(C, S, K, O 등)는 그 경로를 어떻게 알게 됐는지 나타냅니다.
      - R1에 {lan2} 대역으로 가는 정적 경로가 필요합니다. 다음 홉(next-hop)은 R1과 같은 대역에 있는 R2의 주소({r2:eth2})입니다.
  - id: r2-route
    description: R2가 LAN1로 갈 때 직접 넣은 경로를 쓴다
    route: {node: r2, to: pc1:eth1}
    hints:
      - 응답은 R2를 거쳐 돌아옵니다. R2도 {lan1} 대역이 어디 있는지 따로 알아야 합니다.
      - R2에서 `show ip route`로 {lan1} 대역으로 가는 줄이 있는지 보세요. vtysh로 넣은 정적 경로는 S, `ip route add`로 넣은 경로는 K로 보입니다.
      - R2에 {lan1} 대역으로 가는 정적 경로가 필요합니다. 다음 홉은 R2와 같은 대역에 있는 R1의 주소({r1:eth2})입니다.
  - id: pc1-route
    description: PC1에 PC2로 가는 경로가 있다
    route: {node: pc1, to: pc2:eth1}
    hints:
      - PC1은 자기 대역({lan1}) 밖의 주소로 직접 보낼 수 없습니다. 대신 받아서 넘겨 줄 라우터가 필요합니다.
      - PC1에서 `ip route`로 라우팅 테이블을 보세요. `default`로 시작하는 줄이 있나요?
      - PC1에 기본 게이트웨이(기본 경로)가 필요합니다. 게이트웨이는 같은 대역에 있는 R1의 주소({r1:eth1})입니다.
  - id: pc2-route
    description: PC2에 PC1로 가는 경로가 있다
    route: {node: pc2, to: pc1:eth1}
    hints:
      - PC2는 자기 대역({lan2}) 밖의 주소로 직접 보낼 수 없습니다. 대신 받아서 넘겨 줄 라우터가 필요합니다.
      - PC2에서 `ip route`로 라우팅 테이블을 보세요. `default`로 시작하는 줄이 있나요?
      - PC2에 기본 게이트웨이(기본 경로)가 필요합니다. 게이트웨이는 같은 대역에 있는 R2의 주소({r2:eth1})입니다.
