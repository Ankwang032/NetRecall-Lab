[project]
name = "netrecall-lab"
version = "0.1.0"
description = "Notion·Markdown × FSRS × AI × Containerlab 네트워크 학습 플랫폼"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["integrations*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
